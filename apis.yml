- aid: university-of-texas-at-austin:enterprise-idp
  name: UT Austin Enterprise Identity Provider (SAML 2.0 + OpenID Connect)
  x-operator: institution
  x-operator-evidence: >-
    Host enterprise.login.utexas.edu is under the institution's own registrable domain, and the SAML metadata
