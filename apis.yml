  description: >-
    A system that has *allowChildren* set to *true* allows for the creation of child systems based on
    it.

    This ability provides a way to easily clone and manage systems based on existing systems.

    Child systems allow a user to set only a few fields, and use all other values from an existing parent
    system.

    This can reduce the difficulty in managing systems.

    It allows for all child systems to be updated when the parent is updated.
