- aid: university-of-texas-at-austin:university-of-texas-at-austin-scheduler-profiles-api
  name: University of Texas at Austin Scheduler Profiles API
  description: >-
    The Systems service supports managing Tapis scheduler profiles. An HPC center often has certain conventions

    and restrictions around the use of batch schedulers. A scheduler profile resource can be defined to
    provide the

    Tapis Jobs service with additional site specific information to be used when executing applications
    using a

    scheduler. A scheduler profile contains information on options that should be hidden from the scheduler,

    the module load command to use and which modules should be loaded by default when running a job. Anyone
    in a

    tenant may create a scheduler profile for use by all users in the tenant. The owner of a profile or
    a

    tenant administrator may modify or delete a profile. A profile may referenced in a system definition
    using the

    attribute *batchSchedulerProfile*. The profile to be used may also be set in the job submit request
    using the

    special scheduler option *--tapis-profile*. The value in the job submit request takes precedence over
    any value

    defined for the execution system.
  humanURL: https://tapis-project.org/
  baseURL: https://tacc.tapis.io/v3
  tags:
  - Scheduler Profiles
  properties:
  - type: OpenAPI
    url: openapi/university-of-texas-at-austin-scheduler-profiles-api-openapi.yml
