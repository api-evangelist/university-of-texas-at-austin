  detail: >-
    UT Austin operates no central developer portal and no institution-wide API
    catalog, and its enterprise integration APIs sit behind UT EID plus an
    internal ServiceNow request process, so they are not publicly readable. What
    it does operate publicly was found and verified rather than assumed: five
    OpenAPI-described Tapis v3 services on the TACC production tenant, all
    healthy; an InCommon-registered Shibboleth IdP publishing SAML 2.0 metadata
    and an OIDC discovery document; and the Texas ScholarWorks DSpace REST and
    OAI-PMH endpoints on the university's own host. Two surfaces are recorded as
    relationships rather than engineering: the Texas Data Repository Dataverse
    collection (Texas Digital Library) and the Primo library discovery layer
    (Ex Libris) — no vendor contract is saved under this institution. The
    central IT site (it.utexas.edu, now 301 to tech.utexas.edu) returns 403 to
    every non-browser client, so any API-registry documentation it may carry
    could not be read; nothing was inferred from it. github.com/utexas was found
    dead (HTTP 404 — five empty 2016 placeholder repos) and that pointer was
    removed; the institution's real GitHub presence is github.com/TACC.
