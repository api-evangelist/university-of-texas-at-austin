description: >-
  The University of Texas at Austin is a flagship public research university in
  Austin, Texas, United States, and the largest institution in the University of
  Texas System. It operates no central developer portal, publishes no
  institution-wide API catalog, and its enterprise integration APIs (Identity
  and Access Management, student and financial systems) are gated behind UT EID
  authentication and an internal ServiceNow request process, so they are not
  publicly readable. What UT Austin does genuinely operate and expose publicly is
  narrower and more specific than a portal: the Tapis v3 research-computing
  platform, designed, built and run by the Texas Advanced Computing Center — an
  organized research unit of UT Austin — which serves five OpenAPI-described
  services (Systems, Files, Apps, Jobs, Notifications) on its production TACC
  tenant; an InCommon-registered Shibboleth identity provider publishing both
  SAML 2.0 metadata and an OpenID Connect discovery document; and Texas
  ScholarWorks, the UT Libraries DSpace repository, with a public REST API and an
  OAI-PMH 2.0 harvesting endpoint on the university's own host. Its research-data
  archive is a tenancy rather than an operation: UT Austin publishes into a
  Dataverse collection on the Texas Digital Library's shared instance, and the
  library discovery layer is Ex Libris Primo. Both are recorded here as
  relationships, not as UT Austin engineering.
