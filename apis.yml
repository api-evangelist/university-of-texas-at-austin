- aid: university-of-texas-at-austin:university-of-texas-at-austin-sharing-api
  name: University of Texas at Austin Sharing API
  description: >-
    In addition to fine grained permissions support, Tapis also supports a higher level approach to granting
    access.

    This approach is known simply as *sharing*. The sharing API allows an application owner to share an
    application

    with a set of users as well as share publicly with all users in a tenant. Sharing grants users READ
    access to the

    application and more importantly facilitates allowing others to run a job using the application.


    Please note that sharing an application gives a user certain implicit access to resources in the context
    of running

    a job. For example, if the application has defined a specific execution system id then while the job
    is running the

    user who has been granted access to the application via sharing will also have the applications owner's

    authorizations when accessing the system and paths on the system. Note that the application owner's
    authorizations

    supplement the user's authorizations, they do not replace them.
  humanURL: https://tapis-project.org/
  baseURL: https://tacc.tapis.io/v3
  tags:
  - Sharing
  properties:
  - type: OpenAPI
    url: openapi/university-of-texas-at-austin-sharing-api-openapi.yml
