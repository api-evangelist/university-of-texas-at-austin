components:
  schemas:
    ReqSearchSystems:
      type: object
      required:
      - search
      properties:
        search:
          type: array
          minItems: 1
          items:
            type: string
    ResultBoolean:
      type: object
      properties:
        aBool:
          type: boolean
    EnvVarNameString:
      type: string
      minLength: 1
    DescriptionString:
      type: string
      maxLength: 2048
      description: Optional more verbose description.
    SystemTypeEnum:
      type: string
      description: Type of system
      enum:
      - LINUX
      - S3
      - IRODS
      - GLOBUS
    ListTypeEnum:
      type: string
      default: OWNED
      enum:
      - OWNED
      - SHARED_PUBLIC
      - ALL
    SysArgInputModeEnum:
      type: string
      enum:
      - REQUIRED
      - FIXED
      - INCLUDE_ON_DEMAND
      - INCLUDE_BY_DEFAULT
      default: INCLUDE_BY_DEFAULT
    RespName:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        version:
          type: string
        commit:
          type: string
        build:
          type: string
        metadata:
          type: object
        result:
          $ref: '#/components/schemas/ResultName'
    EffectiveUserId:
      type: string
      minLength: 1
      maxLength: 60
      default: ${apiUserId}
      description: Username to use when accessing the system. A specific user (such as a service account) or the dynamic user ``${apiUserId}``.
    JobRuntime:
      type: object
      required:
      - runtimeType
      properties:
        runtimeType:
          $ref: '#/components/schemas/RuntimeTypeEnum'
        version:
          type: string
    ReqPostSystem:
      type: object
      required:
      - id
      - systemType
      - host
      - defaultAuthnMethod
      - canExec
      properties:
        id:
          $ref: '#/components/schemas/SysId'
        description:
          $ref: '#/components/schemas/DescriptionString'
        systemType:
          $ref: '#/components/schemas/SystemTypeEnum'
        owner:
          type: string
          description: A specific user set at system creation.
        host:
          $ref: '#/components/schemas/SysHost'
        enabled:
          $ref: '#/components/schemas/Enabled'
        effectiveUserId:
          $ref: '#/components/schemas/EffectiveUserId'
        defaultAuthnMethod:
          $ref: '#/components/schemas/AuthnEnum'
        authnCredential:
          $ref: '#/components/schemas/ReqPostPutCredential'
        bucketName:
          type: string
          description: Name of the bucket for an S3 type system.
        rootDir:
          $ref: '#/components/schemas/RootDir'
        port:
          type: integer
          format: int32
        useProxy:
          type: boolean
          default: false
        proxyHost:
          $ref: '#/components/schemas/HostString'
        proxyPort:
          type: integer
          format: int32
        dtnSystemId:
          $ref: '#/components/schemas/DtnSysId'
        canExec:
          type: boolean
          description: Indicates if system can be used to execute jobs.
        canRunBatch:
          type: boolean
          default: false
          description: Indicates if system supports running jobs using a batch scheduler.
        enableCmdPrefix:
          type: boolean
          default: false
          description: Indicates if system allows a job submission request to specify a *cmdPrefix*.
        allowChildren:
          type: boolean
          default: false
          description: Indicates if system allows for the creation of child systems.
        mpiCmd:
          type: string
          minLength: 1
          maxLength: 126
        jobRuntimes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/JobRuntime'
        jobWorkingDir:
          $ref: '#/components/schemas/DirString'
        jobEnvVariables:
          type: array
          items:
            $ref: '#/components/schemas/KeyValuePair'
        jobMaxJobs:
          type: integer
        jobMaxJobsPerUser:
          type: integer
        batchScheduler:
          $ref: '#/components/schemas/SchedulerTypeEnum'
        batchLogicalQueues:
          type: array
          items:
            $ref: '#/components/schemas/LogicalQueue'
        batchDefaultLogicalQueue:
          $ref: '#/components/schemas/QueueNameString'
        batchSchedulerProfile:
          $ref: '#/components/schemas/IdString'
        jobCapabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagString'
          description: List of tags as simple strings.
        notes:
          type: object
          description: Metadata in the form of a Json object. Not used by Tapis.
    LogicalQueue:
      type: object
      required:
      - name
      - hpcQueueName
      properties:
        name:
          $ref: '#/components/schemas/QueueNameString'
        description:
          $ref: '#/components/schemas/DescriptionString'
        hpcQueueName:
          $ref: '#/components/schemas/QueueNameString'
        maxJobs:
