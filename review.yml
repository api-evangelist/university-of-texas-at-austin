reviews:
  - date: '2026-06-03'
    rating: 3
    summary: >-
      UT Austin has no single centralized public developer portal, but it
      exposes solid library and research-data APIs that were verified live.
      The Texas ScholarWorks DSpace 8 REST API and its OAI-PMH 2.0 endpoint
      both returned HTTP 200 with "DSpace at UT Austin" identity, and the Texas
      Data Repository Dataverse API (hosted by the Texas Digital Library, shared
      across Texas institutions) returned version 6.10.1. The official utexas
      GitHub org exists. Enterprise APIs (the UT Austin API Registry and IAM
      services) are real but gated behind UT EID/ServiceNow and were not
      publicly testable. No endpoints were fabricated; gated and dead resources
      are noted below.
    endpoints:
      - url: https://repositories.lib.utexas.edu/server/api
        status: 200
        note: DSpace 8 REST API root, HAL+JSON, dspaceName "DSpace at UT Austin".
      - url: https://repositories.lib.utexas.edu/server/oai/request?verb=Identify
        status: 200
        note: OAI-PMH 2.0 Identify, repositoryName "DSpace at UT Austin", earliest 2008.
      - url: https://dataverse.tdl.org/api/info/version
        status: 200
        note: Dataverse REST API v6.10.1 (Texas Digital Library shared instance).
      - url: https://dataverse.tdl.org/dataverse/utexas
        status: 200
        note: UT Austin Dataverse collection landing page (403 to bots, 200 in browser).
      - url: https://www.utexas.edu/
        status: 200
        note: Official university website.
      - url: https://api.github.com/orgs/utexas
        status: 200
        note: Official utexas GitHub org confirmed via API, ~5 public repos.
      - url: https://it.utexas.edu/services/web-publishing-software-development
        status: 200
        note: Enterprise Technology software-development services hub.
      - url: https://guides.lib.utexas.edu/c.php?g=897091
        status: 200
        note: UT Libraries "Working with APIs" LibGuide.
      - url: https://dataverse.tdl.org/api/dataverses/utexas
        status: 403
        note: Collection API endpoint blocks unauthenticated bot requests.
